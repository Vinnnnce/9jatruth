<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="mkt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2d8b"/>
      <stop offset="0.55" stop-color="#c94f4f"/>
      <stop offset="1" stop-color="#f2a154"/>
    </linearGradient>
    <linearGradient id="stall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffe8d6" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#mkt)"/>
  <!-- stall canopies -->
  <g>
    <path d="M80 420 Q300 330 520 420 L520 380 Q300 290 80 380 Z" fill="#f4a259"/>
    <rect x="100" y="420" width="400" height="30" rx="8" fill="#e76f51"/>
    <path d="M680 420 Q900 330 1120 420 L1120 380 Q900 290 680 380 Z" fill="#5fa8d3"/>
    <rect x="700" y="420" width="400" height="30" rx="8" fill="#3d7ea6"/>
  </g>
  <!-- produce -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="200" cy="530" r="34"/><circle cx="280" cy="530" r="34"/><circle cx="360" cy="530" r="34"/>
  </g>
  <g fill="#ffe066">
    <circle cx="200" cy="530" r="20"/><circle cx="280" cy="530" r="20"/><circle cx="360" cy="530" r="20"/>
  </g>
  <g fill="#e63946">
    <rect x="760" y="500" width="70" height="50" rx="12"/><rect x="860" y="500" width="70" height="50" rx="12"/><rect x="960" y="500" width="70" height="50" rx="12"/>
  </g>
  <!-- people silhouettes -->
  <g fill="#2b1a3d" opacity="0.75">
    <circle cx="520" cy="760" r="36"/><rect x="464" y="800" width="112" height="200" rx="44"/>
    <circle cx="700" cy="780" r="32"/><rect x="650" y="816" width="100" height="184" rx="40"/>
    <circle cx="350" cy="800" r="30"/><rect x="304" y="832" width="92" height="168" rx="38"/>
  </g>
  <!-- ground -->
  <rect x="0" y="990" width="1200" height="210" fill="#3a1f4d" opacity="0.55"/>
  <g stroke="#ffd166" stroke-width="4" opacity="0.35">
    <line x1="60" y1="1060" x2="1140" y2="1060"/><line x1="120" y1="1120" x2="1080" y2="1120"/>
  </g>
</svg>
